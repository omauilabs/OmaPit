name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Store and backend tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Community benchmark tests
        run: python -m unittest discover -s community -p 'test_*.py' -v

  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
