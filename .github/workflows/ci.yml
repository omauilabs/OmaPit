name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (see INSTALL.md) and newest.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Store and backend tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Community benchmark tests
        run: python -m unittest discover -s community -p 'test_*.py' -v

  mqtt:
    # MQTT bridge against a real local Mosquitto broker (tests/test_mqtt_broker.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: pip install -r backend/requirements-bridge.txt
      - name: Broker tests
        run: python -m unittest discover -s tests -p 'test_mqtt_broker.py' -v

  qml:
    # Syntax check, then a runtime load against stand-ins for Quickshell and
    # Omarchy (tests/qml/stubs) with the real backend. Not native acceptance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest
      - run: python3 packaging/check_qml.py
      - name: QML runtime test
        run: OMAPIT_REQUIRE_QML=1 QMLTESTRUNNER=/usr/lib/qt6/bin/qmltestrunner python3 -m unittest tests.test_qml_runtime -v

  ntfy:
    # Alarm delivery to a real ntfy server (tests/test_ntfy_delivery.py), built from its pinned Go module.
    runs-on: ubuntu-latest
    env:
      NTFY_VERSION: v2.29.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build ntfy server
        run: |
          src=$(go mod download -json "heckel.io/ntfy/v2@$NTFY_VERSION" | python3 -c "import json,sys;print(json.load(sys.stdin)['Dir'])")
          cp -r "$src" "$RUNNER_TEMP/ntfy-src" && chmod -R u+w "$RUNNER_TEMP/ntfy-src" && cd "$RUNNER_TEMP/ntfy-src"
          # The web app and docs are not needed; empty placeholders satisfy go:embed.
          mkdir -p server/site server/docs && echo ok > server/site/index.html && echo ok > server/docs/index.html
          go build -o "$RUNNER_TEMP/ntfy" .
      - name: Delivery tests
        run: NTFY_BIN="$RUNNER_TEMP/ntfy" python -m unittest discover -s tests -p 'test_ntfy_delivery.py' -v

  home-assistant:
    # Home Assistant bridge against a real local Home Assistant Core (tests/test_home_assistant.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant Core
        run: |
          python -m venv "$RUNNER_TEMP/ha"
          "$RUNNER_TEMP/ha/bin/pip" install homeassistant==2026.2.3 home-assistant-frontend==20260128.6
      - name: Bridge tests
        run: HA_PYTHON="$RUNNER_TEMP/ha/bin/python" python -m unittest discover -s tests -p 'test_home_assistant.py' -v

  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  a11y:
    # Automated WCAG 2.1 A/AA audit of every browser view (axe-core); not a screen-reader test.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Audit desktop and phone views
        run: |
          python3 ../backend/omapit.py --db "$RUNNER_TEMP/a11y.sqlite3" --static dist/client --seed-demo --serve 4199 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4199/ >/dev/null && break; sleep 1; done
          npm run test:a11y
